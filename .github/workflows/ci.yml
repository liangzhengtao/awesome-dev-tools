name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress './**/*.md' --exclude-loopback --exclude 'https://api.github.com'
          fail: false

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: markdownlint '**/*.md' --ignore node_modules
        continue-on-error: true

  check-structure:
    name: Check Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          required_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "CHANGELOG.md"
            ".gitignore"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done

      - name: Verify tool directories exist
        run: |
          required_dirs=(
            "tools/终端工具"
            "tools/编辑器"
            "tools/AI工具"
            "tools/效率工具"
            "tools/设计工具"
          )
          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing required directory: $dir"
              exit 1
            fi
            echo "✅ Found: $dir"
          done

      - name: Count tool files
        run: |
          count=$(find tools -name "*.md" -type f | wc -l)
          echo "📄 Found $count tool files"
          if [ "$count" -lt 12 ]; then
            echo "❌ Expected at least 12 tool files"
            exit 1
          fi
